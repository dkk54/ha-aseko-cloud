name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch upstream Home Assistant or HACS changes that break validation.
    - cron: "0 4 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
