name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch upstream Home Assistant or HACS changes that break validation.
    - cron: "0 4 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Ignore the brands check until the home-assistant/brands PR is
          # merged (requires Aseko PNGs at
          # custom_integrations/aseko_cloud/{icon,logo}.png). Remove this line
          # once the PR lands.
          ignore: brands
